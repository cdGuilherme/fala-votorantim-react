
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Fala-Votorantim

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fala-Votorantim/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar projeto
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Fala-Votorantim/dist

      - name: Publicar site
        uses: actions/deploy-pages@v4